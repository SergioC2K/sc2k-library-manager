[package]
name = "dj-library-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Gestor de librerias DJ: pantalla principal (egui)"

[dependencies]
# Interfaz de escritorio. Sin features de red (http/https): la app es offline.
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Lector XML local para Traktor (collection.nml) y Rekordbox (rekordbox.xml).
# Sin feature "encoding": ambos formatos declaran UTF-8.
quick-xml = { version = "0.30", default-features = false }

[profile.release]
opt-level = 2
